name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build 开开陪玩.exe
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "开开陪玩" `
            --icon "assets\app_icon.ico" `
            --add-data "assets\sprites_v5;assets\sprites_v5" `
            --add-data "assets\app_icon.ico;assets" `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module pandas `
            --exclude-module unittest `
            "src\desktop_pet.py"
          Compress-Archive -Path "dist\开开陪玩.exe" -DestinationPath "dist\开开陪玩-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-peiwan-windows-x64
          path: |
            dist/开开陪玩.exe
            dist/开开陪玩-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/开开陪玩.exe
            dist/开开陪玩-Windows-x64.zip
